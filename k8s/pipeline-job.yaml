apiVersion: batch/v1
kind: Job
metadata:
  name: adrex-pipeline
  namespace: adrex
  labels:
    app.kubernetes.io/name: pipeline
    app.kubernetes.io/part-of: adrex
    app.kubernetes.io/component: pipeline
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline
        app.kubernetes.io/part-of: adrex
        app.kubernetes.io/component: pipeline
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: adrex-pipeline
          image: adrex-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/pipeline.js"]
          env:
            - name: MEILI_URL
              value: http://adrex-meilisearch:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: adrex-meilisearch-secret
                  key: MEILI_MASTER_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: pipeline-data
              mountPath: /app/data
      volumes:
        - name: pipeline-data
          emptyDir: {}
