apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adrex-meilisearch
  namespace: adrex
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/part-of: adrex
    app.kubernetes.io/component: search
spec:
  serviceName: adrex-meilisearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/part-of: adrex
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/part-of: adrex
        app.kubernetes.io/component: search
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7700
              name: http
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: adrex-meilisearch-secret
                  key: MEILI_MASTER_KEY
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          # startupProbe handles cold start with large index (up to 5 min)
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: meili-data
      spec:
        accessModes:
          - ReadWriteOnce
        # For ~3M records, Meilisearch uses mmap — allocate 10x raw data size.
        # SSD-backed storage recommended for search performance.
        resources:
          requests:
            storage: 20Gi
        # Adjust storageClassName to match your cluster.
        # storageClassName: standard
