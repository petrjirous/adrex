apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrex-api
  namespace: adrex
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: adrex
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: adrex
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: adrex
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: adrex-api
          image: adrex-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
              name: http
          env:
            - name: MEILI_URL
              value: http://adrex-meilisearch:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: adrex-meilisearch-secret
                  key: MEILI_MASTER_KEY
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: adrex-api-secret
                  key: API_KEYS
            - name: API_PORT
              value: "3100"
            - name: API_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
